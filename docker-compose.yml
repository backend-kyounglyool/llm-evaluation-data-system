# 로컬 인프라: Apache Kafka(KRaft, ZooKeeper 없음) + Kafka UI + OTel Collector
# transport.backend: kafka 로 전환할 때만 필요. file 모드는 docker 없이 동작.
# Airflow(CeleryExecutor) 공통 설정 — 'airflow' 프로파일: make airflow-up
x-airflow-common: &airflow-common
  image: skill-eval-airflow:2.10.5
  restart: unless-stopped
  profiles: [airflow]
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: skill-eval-local-dev
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # DAG 태스크가 import하는 프로젝트 코드와, 컨테이너 안에서 달라지는 주소·경로
    PYTHONPATH: /opt/skill-eval
    FLINK_REST_URL: http://flink-jobmanager:8081
    SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
    SNOWFLAKE_PRIVATE_KEY_PATH: /opt/airflow/secrets/snowflake_key.p8
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - .:/opt/skill-eval:ro
    - ${SNOWFLAKE_PRIVATE_KEY_PATH:-/dev/null}:/opt/airflow/secrets/snowflake_key.p8:ro
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:19092"   # 같은 장비의 프로세스용
      # 다른 장비의 에이전트용. 기본은 닫혀 있고, .env의 KAFKA_LAN_BIND/KAFKA_LAN_HOST로 연다 (인증 없음 — 사설망에서만)
      - "${KAFKA_LAN_BIND:-127.0.0.1}:19093:19093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092,LAN://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092,LAN://${KAFKA_LAN_HOST:-127.0.0.1}:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,LAN:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: skill-eval
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Flink 세션 클러스터: Kafka agent-events → raw 스트리밍 적재 (잡 제출: make flink-submit)
  flink-jobmanager:
    build: pipeline/flink
    image: skill-eval-flink:1.20
    restart: unless-stopped
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"   # Flink UI / REST (잡 제출이 가능하므로 외부에 열지 않는다)
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # raw가 s3://일 때만 필요. docker compose가 .env 또는 셸 환경변수에서 읽는다
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
    volumes: &flink-volumes
      - ./data:/opt/skill-eval/data
      - ./.flink/jobs:/opt/skill-eval/jobs
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka:
        condition: service_healthy

  flink-taskmanager:
    image: skill-eval-flink:1.20
    restart: unless-stopped
    command: taskmanager
    environment: *flink-env
    volumes: *flink-volumes
    depends_on:
      - flink-jobmanager

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    depends_on:
      kafka:
        condition: service_healthy

  # Collector가 쓴 OTLP span(otel-spans)을 AgentEvent로 바꿔 agent-events에 넣는다
  otel-bridge:
    build:
      context: pipeline
      dockerfile: otel_bridge.Dockerfile
    image: skill-eval-otel-bridge:1
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:   # 필요한 코드만 마운트한다 (.env의 자격증명은 이 컨테이너에 필요 없다)
      - ./common:/opt/skill-eval/common:ro
      - ./pipeline:/opt/skill-eval/pipeline:ro
      - ./config.yaml:/opt/skill-eval/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy

  # ── 모니터링: Prometheus + Grafana(http://localhost:3001) + Tempo ──
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  # Airflow(호스트)가 보내는 StatsD 메트릭을 Prometheus 형식으로 변환
  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    restart: unless-stopped
    command: ["--statsd.mapping-config=/etc/statsd-mapping.yml"]
    volumes:
      - ./monitoring/statsd-mapping.yml:/etc/statsd-mapping.yml
    ports:
      - "127.0.0.1:9125:9125/udp"

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:4319:4318"   # 앱 → Tempo OTLP/HTTP (4317/4318은 OTel Collector가 사용)

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 공식 Snowflake 플러그인은 Enterprise 전용이라 커뮤니티(미서명) 플러그인을 쓴다
      GF_INSTALL_PLUGINS: https://github.com/michelin/snowflake-grafana-datasource/releases/download/v2.1.0/snowflake-grafana-datasource.zip;michelin-snowflake-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: michelin-snowflake-datasource
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-PMODJNM-KM82335}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-SKILL_EVAL}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-MART}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./.grafana/secrets:/run/secrets:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - tempo

  # ── Airflow (profile: airflow) — 웹 UI http://localhost:8082, Flower http://localhost:5555 ──
  airflow-postgres:
    image: postgres:16
    restart: unless-stopped
    profiles: [airflow]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [airflow]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    build: airflow   # 이미지는 여기서 한 번만 빌드하고 나머지 서비스가 공유한다
    restart: "no"
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow users create --username admin --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname skill --lastname eval --role Admin --email admin@example.com
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-redis:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8082:8080"

  # 스케줄러·워커는 --scale로 늘릴 수 있다 (예: --scale airflow-worker=2)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-worker:
    <<: *airflow-common
    command: celery worker

  airflow-flower:
    <<: *airflow-common
    command: celery flower
    ports:
      - "127.0.0.1:5555:5555"

volumes:
  kafka-data:
  airflow-postgres-data:
  flink-checkpoints:
  tempo-data:
  prometheus-data:
  grafana-data:
