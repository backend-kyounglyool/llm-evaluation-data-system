# Tempo 단일 바이너리(로컬 디스크). 앱이 OTLP/HTTP로 보낸 span 트리를 저장하고 Grafana가 조회한다.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 168h
