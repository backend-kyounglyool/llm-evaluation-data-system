# OTel Collector: 외부 앱의 OTLP span 수신 → Kafka(otel-spans) 전달.
# OTLP JSON은 raw 이후 단계가 읽지 못하므로 agent-events에 직접 쓰지 않는다.
# otel-bridge(pipeline/otel_bridge.py)가 otel-spans를 AgentEvent로 바꿔 agent-events에 넣는다.
# 앱은 본문을 보내지 않는 것이 원칙이고, 아래 strip-body는 그래도 섞여 온 본문을 지우는 2차 방어선이다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
  attributes/strip-body:
    actions:
      - key: request.body
        action: delete
      - key: response.body
        action: delete

exporters:
  kafka:
    brokers: [kafka:9092]
    topic: otel-spans
    encoding: otlp_json

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888   # Prometheus가 수집하는 collector 자체 메트릭
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip-body, batch]
      exporters: [kafka]
