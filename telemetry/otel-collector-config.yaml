# OTel Collector: 외부 앱의 OTLP span 수신 → Kafka(otel-spans) 전달.
# OTLP JSON은 raw 이후 단계가 읽지 못하므로 agent-events에 직접 쓰지 않는다.
# otel-bridge(pipeline/otel_bridge.py)가 otel-spans를 AgentEvent로 바꿔 agent-events에 넣는다.
# 같은 span을 Tempo에도 보낸다 (Grafana 트레이스 조회용).
# 본문(request.body)은 Tempo 경로에만 남고, Kafka 경로에서는 strip-body가 항상 지운다.
# 그래서 S3·Snowflake에는 본문이 가지 않고, Tempo(로컬 디스크, 7일 보관)에서만 볼 수 있다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
  attributes/strip-body:
    actions:
      - key: request.body
        action: delete
      - key: response.body
        action: delete

exporters:
  kafka:
    brokers: [kafka:9092]
    topic: otel-spans
    encoding: otlp_json
  otlphttp/tempo:
    endpoint: http://tempo:4318

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888   # Prometheus가 수집하는 collector 자체 메트릭
  pipelines:
    # 이벤트 경로: 본문을 지운 뒤 Kafka로
    traces/events:
      receivers: [otlp]
      processors: [attributes/strip-body, batch]
      exporters: [kafka]
    # 트레이스 경로: 받은 그대로 Tempo로
    traces/tempo:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo]
